name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check app tests
      - run: ruff format --check app tests
      - run: mypy app
      - run: pytest

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t circle-recommendations .
      - name: Smoke test the image
        run: |
          docker run -d --name api -p 8000:8000 circle-recommendations
          for i in $(seq 1 20); do curl -sf localhost:8000/readyz && break; sleep 1; done
          curl -sf localhost:8000/v1/users/23/recommendations | grep -q '"id":22'
          docker rm -f api
